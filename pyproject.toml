[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtga-tracker"
version = "0.4.1"
description = "Track cards played in Magic: The Gathering Arena"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [
    {name = "Travis Patton"}
]
dependencies = [
    "watchdog>=3.0.0",
    "python-dateutil>=2.8.2",
    "ijson>=3.2.0",
    # Deck Downloader (bundled companion tool) — installed with the tracker
    # so it runs out of the box from source and frozen builds alike.
    "beautifulsoup4>=4.12,<5.0",
    "cloudscraper>=1.2,<2.0",
    "requests>=2.31,<3.0",
    "rich>=13.7,<14.0",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6.0",
]
build = [
    "pyinstaller>=6.10.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
mtga-deck-downloader = "mtga_deck_downloader.__main__:main"
mtga-tracker = "mtga_tracker.main:main"
mtga-tracker-app = "mtga_tracker.app:main"
mtga-tracker-audit-db = "mtga_tracker.db_audit:main"
mtga-tracker-dashboard = "mtga_tracker.dashboard:main"
mtga-tracker-draw-quality = "mtga_tracker.draw_quality:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtga_tracker = ["assets/*"]
mtga_deck_downloader = ["default_config.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
