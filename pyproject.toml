[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtga-tracker"
dynamic = ["version"]
description = "Track cards played in Magic: The Gathering Arena"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.9"
authors = [
    {name = "Travis Patton"}
]
dependencies = [
    "watchdog>=3.0.0",
    "python-dateutil>=2.8.2",
    "ijson>=3.2.0",
    # Deck Downloader (bundled companion tool) — installed with the tracker
    # so it runs out of the box from source and frozen builds alike.
    "beautifulsoup4>=4.12,<5.0",
    "cloudscraper>=1.2,<2.0",
    "requests>=2.31,<3.0",
    # In-app updater: PEP 440 version ordering (0.6.5.4 > 0.6.5.3, rc tags).
    "packaging>=23",
    "rich>=13.7,<14.0",
    "emoji>=2.14,<3.0",  # Unicode-aware creator deck-title cleanup (offline)
    "frida==17.9.0; platform_system == 'Darwin' or platform_system == 'Windows'", # Native Arena deck adapter
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6.0",
]
build = [
    "pyinstaller>=6.10.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
mtga-deck-downloader = "mtga_deck_downloader.__main__:main"
mtga-tracker = "mtga_tracker.main:main"
mtga-tracker-app = "mtga_tracker.app:main"
mtga-tracker-audit-db = "mtga_tracker.db_audit:main"
mtga-tracker-dashboard = "mtga_tracker.dashboard:main"
mtga-tracker-draw-quality = "mtga_tracker.draw_quality:main"
mtga-tracker-replay-dump = "mtga_tracker.replay_dump:main"

# The release tag IS the version: `git tag v0.5.9.1` and every artifact,
# API payload, and UI readout derives from it. Nothing to edit per release.
# From a git checkout the version comes from the nearest v* tag (dev builds
# between tags get 0.5.9.2.devN+g<sha>); a tarball without git history falls
# back to 0.0.0+unknown rather than failing to install. Source runs read the
# same version live from git (src/mtga_tracker/source_version.py).
[tool.setuptools_scm]
version_file = "src/mtga_tracker/_version.py"
fallback_version = "0.0.0+unknown"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mtga_tracker = ["assets/*"]
mtga_deck_downloader = ["default_config.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
