[package]
name = "tapps-overlay"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tapps_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

# Local iteration: same as release minus the slow parts (fat LTO over every
# dependency, one codegen unit, size optimisation). Its own target/fast/
# directory, so switching between it and a real release build never throws
# the other's cache away. scripts/build_overlay.sh --fast uses it.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
opt-level = 1
